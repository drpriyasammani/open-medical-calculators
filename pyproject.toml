[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nirogilanka-clinical"
version = "2.0.0"
description = "Evidence-based clinical medical calculators (South Asian WHO BMI, FIB-4, CKD-EPI 2021 eGFR, NIH Sampson LDL, HOMA-IR, Corrected Calcium) and trilingual Sinhala-Tamil-English ICD-10 medical terminology lookup curated by Dr. Priya Sammani at Nirogi Lanka."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
  {name = "Dr. Priya Sammani (MBBS, PG Dip. in Family Medicine)", email = "drpriya@radiology.lk"}
]
keywords = [
  "medical-calculators",
  "clinical-calculators",
  "south-asian-bmi",
  "fib-4",
  "egfr",
  "ckd-epi-2021",
  "sampson-ldl",
  "homa-ir",
  "icd-10",
  "sinhala",
  "tamil",
  "sri-lanka",
  "public-health"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps."
]

[project.urls]
Homepage = "https://nirogilanka.com/en/health-calculators/"
Documentation = "https://open-medical-calculators.readthedocs.io/"
Repository = "https://github.com/drpriyasammani/open-medical-calculators"
"Clinical Encyclopedia" = "https://nirogilanka.com/en/"
"Medical Glossary Dataset" = "https://nirogilanka.com/medical-glossary/"
"Zenodo DOI" = "https://doi.org/10.5281/zenodo.24336278"

[tool.setuptools.packages.find]
where = ["src"]
